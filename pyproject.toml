[project]
name = "strat-creator"
version = "0.1.0"
description = "Skills for creating, refining, and reviewing strategy documents from approved RFEs"
requires-python = ">=3.11"
dependencies = [
    "certifi",
    "diff-match-patch",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "jira-emulator @ git+https://github.com/jctanner/jira-emulator.git",
    "jsonschema>=4.26.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate-dashboard.py" = ["E501"]
"scripts/generate-report.py" = ["E501"]
# every pin names the descriptor field and the consuming file:line in one assertion message
"tests/test_type_registry_pins.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
