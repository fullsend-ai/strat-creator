# types/react-shopping-cart-strategy/type.yaml — the react-shopping-cart-strategy work-item type: the HOW for a
# Shop RFE (a TSTAPP Story written by rfe-creator's `react-shopping-cart` type), produced on the SAME Story, for the
# demo storefront fullsend-ai/react-shopping-cart. Contract: types/_schema/type.schema.json.
#
# Modeled on initiative-strategy (relation.kind: self). Every value is AUTHORED; values shared with rfe-strategy
# (labels, dirs, rubric, dimensions) are the station's and are copied. What this type does differently:
#   Where the HOW lands: in the Story's DESCRIPTION, below the Shop RFE's own sections (pipeline.strategy_home:
#       description), as "## Strategy (AI Generated by Agentic SDLC Pipeline)" (TL;DR, then the technical detail)
#       and "## Staff Engineer / SME Input", as on an RHAISTRAT Feature. fullsend's code agent reads the issue
#       description and comments, never attachments. The Shop RFE sections above the Strategy heading stay
#       rfe-creator's: push replaces only the two strategy sections.
#   Sign-off: none. A person typing /fs-code on the Story is the sign-off, so there is no signoff stage, and
#       strat-creator never adds ready-to-code (which would dispatch fullsend's code agent on its own).
#   No [DRAFT] prefix: there is no conventions.summary_prefix, because on the shared Story it would rename the Shop RFE.
#   Architecture context: the storefront's own docs (docs/architecture in the app repository), fetched into
#       .context/react-shopping-cart-architecture/; the architecture dimension runs only when they are present.
#   Runs by hand with the skills (--type react-shopping-cart-strategy); the managed CI pipeline still assumes
#       RHAISTRAT keys and does not process TSTAPP Stories.
schema_version: 1
type: react-shopping-cart-strategy
display: { entity: Shop Strategy, entity_plural: Shop Strategies }
kind: strategy

identity:
  tracker: jira
  jira:
    project: TSTAPP                                     # the derived record IS the Shop RFE's Story
    issue_type: Story                                   # rfe-creator types/react-shopping-cart/type.yaml identity.jira
    key_prefixes: ["TSTAPP-"]
  local_prefix: "RSCSTRAT-"                             # local drafts before a key exists; authored
  local_id_pattern: '^RSCSTRAT-\d+$'                    # ONE backslash
  id_field: strat_id
  tracker_key_field: jira_key

inputs:
  - from_type: react-shopping-cart                      # rfe-creator's type name, carried as data
    jira:
      project: TSTAPP
      issue_type: Story
      key_prefixes: ["TSTAPP-"]
    relation:
      kind: self                                        # the strategy is written on the Shop RFE's Story itself
    source_ref_field: source_shop_rfe
    removed_context_marker:                             # rfe-creator react-shopping-cart conventions: a CONSUMED contract
      comment_prefix: "[Shop RFE Creator]"
      phrase: "The following implementation details were removed from the Shop RFE description during review."
    skip_if:
      single_open_unlabeled_override: false             # no clones -> nothing to re-import

discovery:
  settings: config/react-shopping-cart-settings.yaml    # the intake gate, skip lists and batch size

dirs:                                                   # shared with rfe-strategy: one artifacts tree, file names differ by key
  tasks: artifacts/strat-tasks
  originals: artifacts/strat-originals
  reviews: artifacts/strat-reviews
workspace: { root: local }
files:
  tickets: artifacts/strat-tickets.md
  skipped: artifacts/strat-skipped.md
index: { enabled: false }
companions:
  comments: true
  removed_context: false

conventions:                                            # the station's label vocabulary, shared with rfe-strategy
  label_prefix: strat-creator
  labels:
    rubric_pass: strat-creator-rubric-pass
    needs_attention: strat-creator-needs-attention
    ignore: strat-creator-ignore
    auto_created: strat-creator-auto-created
    auto_refined: strat-creator-auto-refined
    auto_revised: strat-creator-auto-revised
    human_sign_off: strat-creator-human-sign-off        # never written for this type (no signoff stage); a person adding it still stops writes
    processing: strat-creator-processing
  label_categories:
    auto_created: provenance
    auto_refined: provenance
    auto_revised: provenance
    rubric_pass: gate
    needs_attention: escalation
    ignore: exclusion
    human_sign_off: gate
  comment_prefix: "[Strat Creator]"                     # no summary_prefix: no [DRAFT] on the shared Story

schema:
  task:
    status_enum: [Draft, Ready, Refined, Reviewed]
    extra_fields:
      source_shop_rfe: { type: string, required: true, pattern: '^(RSC-\d+|TSTAPP-\d+)$' }   # the input's key prefix plus rfe-creator's local prefix RSC-
      jira_key: { type: string, required: false, pattern: '^TSTAPP-\d+$', default: null }
      workflow: { type: string, required: false, enum: [local, ci], default: null }
      latest_diff: { type: string, required: false, default: null }
      refine_count: { type: int, required: false }      # no default on purpose (ADR-0001), as for rfe-strategy
    priority:
      enum: [Blocker, Critical, Major, Normal, Minor, Undefined]
      map_to_tracker: {}
  review:
    score_fields: [feasibility, testability, scope, architecture]
    total_field: total
    recommendation_enum: [approve, revise, reject]
    extra_fields:
      reviewers:
        type: dict
        required: true
        fields:
          feasibility: { type: string, required: true, enum: [approve, revise, reject, pending] }
          testability: { type: string, required: true, enum: [approve, revise, reject, pending] }
          scope: { type: string, required: true, enum: [approve, revise, reject, pending] }
          architecture: { type: string, required: true, enum: [approve, revise, reject, skipped, pending] }
    verdict_rules:
      approve: { total_min: 6, zeros_max: 0 }
      revise: { total_min: 3, zeros_max: 1 }

pipeline:
  stages: [create, refine, review, pull, push]          # no signoff: /fs-code on the Story is the sign-off
  context_sources:
    - name: architecture-context
      bootstrap: scripts/fetch-architecture-context.sh
      args: ["--repo", "https://github.com/fullsend-ai/react-shopping-cart", "--path", "docs/architecture", "--dest", ".context/react-shopping-cart-architecture"]
      required: false
  scorer_agent: strat-scorer
  prompts:
    template: types/react-shopping-cart-strategy/strat-template.md
  dimensions:
    - { name: feasibility, prompt: .claude/skills/strategy-feasibility-review/SKILL.md, blocking: true }
    - { name: testability, prompt: .claude/skills/strategy-testability-review/SKILL.md, blocking: true }
    - { name: scope, prompt: .claude/skills/strategy-scope-review/SKILL.md, blocking: true }
    - name: architecture
      prompt: .claude/skills/strategy-architecture-review/SKILL.md
      blocking: true
      condition: { context_exists: .context/react-shopping-cart-architecture/docs/architecture }
  rubric:                                               # rfe-strategy's rubric, unchanged
    repo: self
    path: scripts/assess-strat/agent_prompt.md
    rubric_version: "93a3722cbd00076723679e3ec666a6e2fc15038791b69f670245671360d2e5f7"
    export: artifacts/strat-rubric.md
  lock:
    label: strat-creator-processing
    blocking_labels: [strat-creator-processing, strat-creator-needs-attention, strat-creator-human-sign-off]
    derived_required_label: strat-creator-auto-created
    derived_blocking_labels: [strat-creator-needs-attention, strat-creator-human-sign-off]
  strategy_home: description                            # the code agent reads the description; see the header
  body_overflow:                                        # only when Jira rejects the description: the TL;DR stays in it, the full strategy goes here
    on_error: CONTENT_LIMIT_EXCEEDED
    attachment: "{issue_key}-strategy.md"
    policy: append_only
  section_ownership:                                    # the local task file's sections; on Jira the Shop RFE's sections stay rfe-creator's
    - { heading: "## Business Need (from Shop RFE)", owner: source }
    - { heading: "## Strategy (AI Generated by Agentic SDLC Pipeline)", owner: pipeline }
    - { heading: "## Staff Engineer / SME Input", owner: human }

snapshot: { mode: none, processed_gate: inputs.0.skip_if }
reporting:
  criterion_labels: { feasibility: Feasibility, testability: Testability, scope: Scope, architecture: Architecture }
eval:                                                   # rfe-strategy's eval with --type react-shopping-cart-strategy; no dataset or baseline yet, thresholds copied
  config: eval/strat-refine-react-shopping-cart.yaml
  dataset: eval/dataset/react-shopping-cart-cases
  timeout: 2700
  thresholds:
    files_exist: { min_pass_rate: 1.0 }
    strategy_nonempty: { min_pass_rate: 1.0 }
    frontmatter_valid: { min_pass_rate: 1.0 }
    recommendation_consistency: { min_pass_rate: 1.0 }
    architecture_context_used: { min_pass_rate: 0.7 }
    feasibility_score: { min_mean: 1.0 }
    testability_score: { min_mean: 1.0 }
    scope_score: { min_mean: 1.5 }
    architecture_score: { min_mean: 1.0 }
    pipeline_total: { min_mean: 5.0 }
    cost_budget: { min_pass_rate: 0.8 }
