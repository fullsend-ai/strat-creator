# Sandbox policy for strat-single, strat-batch and strat-resume.
# Filesystem, landlock and process identity are fullsend-ai/agents
# policies/base.yaml at 11dd3ad (the same pin rfe-creator uses). Model traffic
# comes from the pinned vertex-ai provider. The only other egress is Jira:
# architecture context is fetched by the host pre-script, and publication runs
# in the host post-script, so GitHub and the results services are not
# reachable from the sandbox.
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  jira:
    name: strat-creator-jira
    endpoints:
    # Opaque TLS tunnel: the repository's Python Jira client verifies the
    # server certificate itself and sends JIRA_TOKEN. Host, port and the
    # calling binary stay enforced. Read-write, unlike rfe-creator's read-only
    # Jira profile: strategy creation clones, links, labels, pushes and
    # comments.
    - host: redhat.atlassian.net
      port: 443
      tls: skip
    binaries:
    - path: '**/python3*'
