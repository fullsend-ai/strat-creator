---
# strat-resume: resume the pipeline for one STRAT from a /fs-strat resume comment on its Jira issue.
# The sequence runs in the strat-pipeline Workflow, shipped as a Claude Code
# plugin (plugins/strat-pipeline) that fullsend uploads and scans. See
# ../README.md.
agent: strat-resume/prompt.md
description: Resume the pipeline for one STRAT from a /fs-strat resume comment on its Jira issue.
model: claude-opus-4-6
effort: high
# fullsend v0.45.0 sandbox image (multi-arch index digest); ships Claude Code 2.1.286.
image: ghcr.io/fullsend-ai/fullsend-sandbox@sha256:dec698251c58eabcb0c0d6d08ab9ca4415929991cc1deec5d3f3a94de5db6cca
policy: shared/policy.yaml
# A role the hosted mint serves (not the agent name). triage is the narrowest:
# the agent writes only to Jira, never to the repository.
role: triage
slug: opendatahub-io-strat-creator
plugins:
  - plugins/strat-pipeline

# A comment "/fs-strat resume" on a RHAISTRAT issue, delivered by fullsend's
# Jira integration, starts this agent for that STRAT. The pre-script resolves
# the STRAT to its RFE, computes the resume point and refuses a STRAT that is
# still at a human gate. Only a human with write access may start it: the
# run writes to Jira. Shape follows fullsend's comment_added triggers
# (docs/guides/user/cel-triggers-reference.md in fullsend v0.45.0).
trigger: >
  event.transition.kind == "comment_added"
    && event.entity.kind == "work_item"
    && has(event.source) && event.source.system == "jira"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fs-strat"
    && has(event.transition.comment.instruction)
    && event.transition.comment.instruction.startsWith("resume")
    && event.actor.kind == "human"
    && event.actor.role in ["admin", "maintain", "write"]

host_files:
  - src: shared/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json

pre_script: shared/pre-strategy.sh
post_script: shared/post-strategy.sh

# A second iteration runs in the same sandbox: the Workflow reads
# tmp/strat-progress.json and runs only what is not recorded, and the
# validator's findings are appended to the prompt.
validation_loop:
  preflight_check: 'python3 -c "import jsonschema, yaml"'
  script: shared/validate-output.sh
  schema: shared/result.schema.json
  max_iterations: 2
  feedback_mode: append

timeout_minutes: 90

env:
  sandbox:
    JIRA_SERVER: "${JIRA_SERVER}"
    JIRA_USER: "${JIRA_USER}"
    # Opaque TLS tunnel (shared/policy.yaml): the Python Jira client sends the
    # token itself, so it is in the sandbox.
    JIRA_TOKEN: "${JIRA_TOKEN}"
    # Context is fetched by the pre-script; the skills must not fetch again.
    RFE_SKIP_BOOTSTRAP: "1"
    ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-4-6
    CLAUDE_CODE_SUBAGENT_MODEL: claude-opus-4-6
  runner:
    STRAT_MODE: resume
    # The strat-creator commit this harness is pinned to (the same sha as the
    # harness URL a consumer installs). The pre-script clones and verifies it
    # on the host; STRAT_CREATOR_REPO may name a mirror (default: GitHub).
    STRAT_CREATOR_REF: ${STRAT_CREATOR_REF}
    STRAT_CREATOR_REPO: ${STRAT_CREATOR_REPO}
    # Set by fullsend's dispatch from the commented Jira issue (the RHAISTRAT key).
    STRAT_RESUME_KEY: ${FULLSEND_WORK_ITEM_KEY}
    STRAT_RUN_ID: ${STRAT_RUN_ID}
    # Host-only run and lock record (prepare_run.py); never in the sandbox.
    # The CI cleanup releases locks from it (shared/release-locks.sh).
    STRAT_STATE_DIR: ${STRAT_STATE_DIR}
    STRAT_DRY_RUN: ${STRAT_DRY_RUN}
    STRAT_PREVIOUS_PROGRESS: ${STRAT_PREVIOUS_PROGRESS}
    STRAT_ARCHITECTURE_CONTEXT_PATH: ${STRAT_ARCHITECTURE_CONTEXT_PATH}
    STRAT_PUBLISH_DIR: ${STRAT_PUBLISH_DIR}
    JIRA_SERVER: ${JIRA_SERVER}
    JIRA_USER: ${JIRA_USER}
    JIRA_TOKEN: ${JIRA_TOKEN}
    RESULTS_REPO_URL: ${RESULTS_REPO_URL}
    RESULTS_PUSH_TOKEN: ${RESULTS_PUSH_TOKEN}
    RESULTS_GIT_USER: ${RESULTS_GIT_USER}
    ORG_PULSE_URL: ${ORG_PULSE_URL}
    ORG_PULSE_API_TOKEN: ${ORG_PULSE_API_TOKEN}

openshell:
  profiles:
    - https://raw.githubusercontent.com/fullsend-ai/agents/11dd3ad15ab5033fd04661d7faf6f7af45548d2f/profiles/fullsend-vertex-ai.yaml#sha256=71ea4699ec497d4b9592220adf7588019eb8445dbc77af8e0e6767e68dcb5585
providers:
  - https://raw.githubusercontent.com/fullsend-ai/agents/11dd3ad15ab5033fd04661d7faf6f7af45548d2f/providers/vertex-ai.yaml#sha256=ae5ebe527e5d7b0fa6994346fde3f6ba11b632a3ba78ece96591b5ed85083ec1
