# Pipeline-level settings for JQL-based RFE discovery
jql:
  project: RHAIRFE
  required_labels:
    - strat-creator-3.5
    - strat-creator-3.6
    - strat-creator-3.7
    - strat-creator-3.8
  target_versions:     # OR'd with required_labels via cf[10855]
    # Legacy short names (still on older tickets)
    - rhoai-3.5
    - rhoai-3.5.EA1
    - rhoai-3.5.EA2
    - rhoai-3.6
    - rhoai-3.6.EA1
    - rhoai-3.6.EA2
    # Release-level names
    - rhai-3.6
    - rhai-3.7
    - rhai-3.8
    # 3.5 milestones — RHAII, RHOAI, RHELAI
    - "3.5 EA1 RHAII RELEASE"
    - "3.5 EA1 RHOAI RELEASE"
    - "3.5 EA1 RHELAI RELEASE"
    - "3.5 EA2 RHAII RELEASE"
    - "3.5 EA2 RHOAI RELEASE"
    - "3.5 EA2 RHELAI RELEASE"
    - "3.5 GA RHAII RELEASE"
    - "3.5 GA RHOAI RELEASE"
    - "3.5 GA RHELAI RELEASE"
    # 3.6 milestones — RHAII, RHOAI, RHELAI
    - "3.6 EA1 RHAII RELEASE"
    - "3.6 EA1 RHOAI RELEASE"
    - "3.6 EA1 RHELAI RELEASE"
    - "3.6 EA2 RHAII RELEASE"
    - "3.6 EA2 RHOAI RELEASE"
    - "3.6 EA2 RHELAI RELEASE"
    - "3.6 GA RHAII RELEASE"
    - "3.6 GA RHOAI RELEASE"
    - "3.6 GA RHELAI RELEASE"
    # 3.7 milestones — RHAII, RHOAI, RHELAI
    - "3.7 EA RHAII RELEASE"
    - "3.7 EA RHOAI RELEASE"
    - "3.7 EA RHELAI RELEASE"
    - "3.7 GA  RHAII RELEASE"   # double space matches the Jira version name
    - "3.7 GA RHOAI RELEASE"
    - "3.7 GA RHELAI RELEASE"
    # 3.8 milestones — RHAII, RHOAI, RHELAI
    # Not yet created in Jira; names follow the 3.6 pattern. Verify once
    # they exist, since unknown names are silently ignored by JQL.
    - "3.8 EA1 RHAII RELEASE"
    - "3.8 EA1 RHOAI RELEASE"
    - "3.8 EA1 RHELAI RELEASE"
    - "3.8 EA2 RHAII RELEASE"
    - "3.8 EA2 RHOAI RELEASE"
    - "3.8 EA2 RHELAI RELEASE"
    - "3.8 GA RHAII RELEASE"
    - "3.8 GA RHOAI RELEASE"
    - "3.8 GA RHELAI RELEASE"
  quality_labels:      # at least one required
    - rfe-creator-autofix-rubric-pass
    - tech-reviewed
  excluded_labels:     # RFE-level locks — lock_issues.py would reject these
    - strat-creator-processing
    - strat-creator-rework-needed
  excluded_statuses:
    - Closed
    - Resolved
    - Draft
  order_by: key ASC

batch_size: 10

# Labels on RHAISTRAT that indicate the RFE was already processed
skip_labels:
  - strat-creator-rubric-pass
  - strat-creator-needs-attention
  - strat-creator-processing

# RHAISTRAT statuses that indicate active or completed work — exclude
# their source RFEs from batching to avoid wasting batch slots
excluded_strat_statuses:
  - In Progress
  - Review
  - Release Pending
  - Closed
  - Resolved
