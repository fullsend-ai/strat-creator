# Pipeline-level settings for JQL-based RFE discovery
jql:
  project: RHAIRFE
  required_labels:
    - strat-creator-3.5
    - strat-creator-3.6
    - strat-creator-3.7
    - strat-creator-3.8
  # Target Versions (cf[10855]) are OR'd with required_labels. They are resolved at
  # runtime from RHAIRFE's live Jira version list (jira_utils.resolve_target_versions):
  # each train selects its unreleased, unarchived versions named
  # "<train> <EA|EAn|GA> <RHAII|RHOAI|RHELAI> RELEASE". A train that matches nothing
  # fails the run; a train version with another name is skipped with a warning.
  # A non-empty `target_versions` list is an explicit full override of both keys below.
  target_version_trains:   # active release trains; quote each one ("3.10", not 3.10)
    - "3.7"
    - "3.8"
  # Names the trains cannot resolve: release-level names, and values issues still hold
  # with no backing Jira version. The durable fix for such an orphan is retargeting the
  # issues in Jira, not this list.
  extra_target_versions:
    - rhai-3.7
    - rhai-3.8
    - "3.7 EA RHELAI RELEASE"   # orphan: no backing version (4 RFEs, 2026-11)
  quality_labels:      # at least one required
    - rfe-creator-autofix-rubric-pass
    - tech-reviewed
  excluded_labels:     # RFE-level locks — lock_issues.py would reject these
    - strat-creator-processing
  excluded_statuses:
    - Closed
    - Resolved
    - Draft
  order_by: key ASC

batch_size: 10

# Labels on RHAISTRAT that indicate the RFE was already processed
skip_labels:
  - strat-creator-rubric-pass
  - strat-creator-needs-attention
  - strat-creator-processing

# RHAISTRAT statuses that indicate active or completed work — exclude
# their source RFEs from batching to avoid wasting batch slots
excluded_strat_statuses:
  - In Progress
  - Review
  - Release Pending
  - Closed
  - Resolved
